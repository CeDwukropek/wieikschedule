name: Personal schedule
on:
  pull_request:
    paths: ['api/**','src/**','integrations/schedule-tools/**','DB/migrations/**','ops/staging/**','.github/workflows/personal-schedule.yml']
  push:
    paths: ['api/**','src/**','integrations/schedule-tools/**','DB/migrations/**','ops/staging/**','.github/workflows/personal-schedule.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: schedule_staging
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: schedule_staging
      PGPASSWORD: synthetic-test-only
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false --runInBand
      - run: node --test api/_routes/*.test.cjs api/_routes/*/*.test.cjs integrations/schedule-tools/*.test.cjs
      - run: python3 -m unittest discover -s ops/staging -p 'test_*.py'
      - name: Test private schema on disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          psql -X -v ON_ERROR_STOP=1 -f ops/staging/schema.sql
          psql -X -v ON_ERROR_STOP=1 -f DB/migrations/20261014_wieik_import.sql
          psql -X -v ON_ERROR_STOP=1 -f DB/migrations/20261015_unlinked_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f DB/migrations/20261015_personal_overrides.sql
          for migration in 20261021_calendar_links 20261022_calendar_writes 20261023_plan_versions_and_hygiene 20261024_release_hardening 20261025_plan_items_and_roles 20261026_conflicts_without_retry 20261027_weekend_changes 20261028_series_of_one_kind; do
            psql -X -v ON_ERROR_STOP=1 -f DB/migrations/$migration.sql
          done
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.events(faculty,date,start_time,subject,status,source_system,source_key) VALUES('TEST','2026-10-12','09:00','Synthetic','aktywne','wieik','synthetic-key');"
          psql -X -v ON_ERROR_STOP=1 -f integrations/schedule-tools/database-test.sql
          psql -X -v ON_ERROR_STOP=1 -f integrations/schedule-tools/calendar-links-test.sql
          psql -X -v ON_ERROR_STOP=1 -f integrations/schedule-tools/plan-versions-test.sql
          psql -X -v ON_ERROR_STOP=1 -f integrations/schedule-tools/plan-items-test.sql
